# Server Configuration (8082 to avoid conflict with service-user on 8081)
server:
  port: 8082

# Application Name
spring:
  application:
    name: service-feedback

  datasource:
    url: jdbc:mysql://localhost:3306/skillforge_feedback?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# CORS Configuration - Allow Angular Apps (include your dev server port, e.g. 59267)
cors:
  allowed-origins: http://localhost:4200,http://localhost:4201,http://localhost:59267,http://127.0.0.1:4200,http://127.0.0.1:4201,http://127.0.0.1:59267
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Swagger / OpenAPI (test the API in the browser)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    org.springframework.web: DEBUG
    com.gestions.ramzi.servicefeedback: DEBUG
