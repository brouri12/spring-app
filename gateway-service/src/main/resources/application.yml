server:
  port: 8080

spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200,http://localhost:4201,http://localhost:59267,http://127.0.0.1:4200,http://127.0.0.1:4201,http://127.0.0.1:59267"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: lb://service-user
          predicates:
            - Path=/api/users/**
        - id: feedback-service
          uri: lb://service-feedback
          predicates:
            - Path=/api/feedbacks/**
        - id: reclamations-service
          uri: lb://service-feedback
          predicates:
            - Path=/api/reclamations/**
        - id: resolutions-service
          uri: lb://service-feedback
          predicates:
            - Path=/api/resolutions/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
